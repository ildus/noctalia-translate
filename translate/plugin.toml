id = "ildus/translate"
name = "Translate"
version = "1.3.0"
plugin_api = 22
author = "ildus"
license = "MIT"
icon = "language"
description = "Bar icon that translates text through an OpenAI-compatible API."

[[widget]]
id = "translate"
entry = "widget.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 420
height = 280
placement = "attached"
position = "auto"
open_near_click = true
keyboard_focus = "exclusive"
capture_keys = ["return", "kp_enter"]

[[panel]]
id = "settings"
entry = "settings.luau"
width = 400
height = 260
placement = "floating"
position = "center"
persistent = true
dismiss_on_outside_click = false
keyboard_focus = "on_demand"
capture_keys = ["return", "kp_enter"]

[[setting]]
key = "base_url"
type = "string"
label_key = "settings.base_url.label"
description_key = "settings.base_url.description"
default = ""

[[setting]]
key = "api_key"
type = "string"
label_key = "settings.api_key.label"
description_key = "settings.api_key.description"
default = ""

[[setting]]
key = "model"
type = "string"
label_key = "settings.model.label"
description_key = "settings.model.description"
default = "google/gemma-4-12B-it-qat-q4_0-gguf"
